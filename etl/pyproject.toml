[project]
name = "analytics-etl"
version = "0.1.0"
description = "Incremental ETL from the Postgres operational schema into the DuckDB FACT_TRADES star schema."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=0.10",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
etl = "etl.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
