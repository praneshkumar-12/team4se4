[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sprint-04-analytics-etl"
version = "0.1.0"
description = "Market-data analytics ETL pipeline for Sprint 4"
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.0",
  "requests>=2.31",
  "pandas>=2.0",
  "plotly>=5.18",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
analytics-etl = "analytics_etl.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
