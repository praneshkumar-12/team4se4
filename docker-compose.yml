# Local orchestration for Sprint 6. One command starts Postgres and the Trade
# REST API. Nothing this sprint needs Kafka.
#
#   JWT_SECRET must be set in .env (see .env.example). It is never baked into
#   the image or committed.
#
#   The database starts empty; the Trade REST API builds the full Sprint 3
#   schema (tables, constraints, triggers, indexes) with Liquibase on startup,
#   and loads the demo seed when LIQUIBASE_CONTEXTS includes "demo".

services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trade_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-trade_db}"]
      interval: 5s
      timeout: 3s
      retries: 10

  trade-api:
    build:
      context: .
      dockerfile: sprint-06-trade-api/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-trade_db}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_ISSUER: ${JWT_ISSUER:-auth-service}
      LIQUIBASE_CONTEXTS: ${LIQUIBASE_CONTEXTS:-}
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8085/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 40s

  # SonarQube quality gate (Sprint 7, SEC4-620). Independent of the other
  # services — only used locally to run `mvn sonar:sonar` / the Python
  # scanner image against. Added as its own block to keep this additive and
  # merge-friendly alongside the other members' service additions.
  sonarqube:
    image: sonarqube:community
    ports:
      - "9000:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  postgres-data:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
