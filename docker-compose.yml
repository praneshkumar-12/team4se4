# Local orchestration. Starts Postgres, a single-broker Kafka (KRaft mode, no
# ZooKeeper) and the Trade REST API.
#
#   JWT_SECRET must be set in .env (see .env.example). It is never baked into
#   the image or committed.
#
#   The database starts empty; the Trade REST API builds the full Sprint 3
#   schema (tables, constraints, triggers, indexes) with Liquibase on startup,
#   and loads the demo seed when LIQUIBASE_CONTEXTS includes "demo".

#   Kafka auto-topic-creation is off on purpose (see design/kafka.md). After
#   `docker-compose up -d kafka`, run `scripts/kafka-init.sh` once before
#   starting trade-api, or trade-api's publishes will fail against topics
#   that don't exist yet.

services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trade_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "8091:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-trade_db}"]
      interval: 5s
      timeout: 3s
      retries: 10

# Single-broker Kafka in KRaft mode (combined broker+controller, no
  # ZooKeeper). See design/kafka.md for why auto-topic-creation is off and
  # why the topics need scripts/kafka-init.sh run against this service.
  kafka:
    image: apache/kafka:3.7.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:8090
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Auto-creation is explicitly forbidden by SEC4-611: left on, the first
      # producer/consumer to touch an unknown topic silently gets a
      # 1-partition, default-retention topic instead of what the contract
      # fixes. scripts/kafka-init.sh creates the real topics explicitly.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Fixed cluster id for a reproducible local single-node KRaft cluster.
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "8090:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  trade-api:
    build:
      context: .
      dockerfile: sprint-06-trade-api/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-trade_db}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_ISSUER: ${JWT_ISSUER:-auth-service}
      LIQUIBASE_CONTEXTS: ${LIQUIBASE_CONTEXTS:-}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8085/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 40s

  # Applies the auth service's own Liquibase changelog (SEC4-624's "your
  # migration or bootstrap") - sprint-08-auth-service/db/changelog/. The
  # Trade REST API already runs Liquibase for its own schema, internally,
  # via Spring Boot's Liquibase starter, on its own startup (see the
  # trade-api service above); this is the equivalent for a service that
  # isn't a JVM process, run as a one-shot job via the official Liquibase
  # image instead of a library the app boots with. Waits on trade-api
  # rather than only on postgres: users.account_id is a foreign key to
  # accounts(account_id), which only exists once trade-api's own Liquibase
  # run has built the Sprint 3 schema. Exits after `update` succeeds;
  # auth-service's depends_on below waits for that exit, not a healthcheck.
  auth-service-migrate:
    image: liquibase/liquibase:4.29
    volumes:
      - ./sprint-08-auth-service/db/changelog:/liquibase/changelog
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-trade_db}
      LIQUIBASE_COMMAND_USERNAME: ${POSTGRES_USER:-postgres}
      LIQUIBASE_COMMAND_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      LIQUIBASE_COMMAND_CHANGELOG_FILE: db.changelog-master.xml
      # The bundled image resolves --changelog-file against /liquibase by
      # default, not the mounted volume - this points it at
      # /liquibase/changelog instead. Found by actually running the image
      # against a throwaway Postgres before writing this file: without it,
      # Liquibase reports the changelog "not found in the configured
      # search path" even though the mount itself is correct.
      LIQUIBASE_SEARCH_PATH: /liquibase/changelog
    command: ["update"]
    depends_on:
      postgres:
        condition: service_healthy
      trade-api:
        condition: service_healthy

  # Team 4 auth service (Sprint 8, SEC4-622). Reserved on port 3000 by
  # infra/README.md.
  auth-service:
    build:
      # Its own directory as context, unlike trade-api: this service has no
      # sibling Maven module to pull in, so the Dockerfile's COPY paths
      # (package.json, src/, ...) are relative to sprint-08-auth-service/
      # itself rather than the repo root.
      context: ./sprint-08-auth-service
      dockerfile: Dockerfile
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-trade_db}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_ISSUER: ${JWT_ISSUER:-auth-service}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health | grep -q '\"status\":\"up\"'"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s

  # SonarQube quality gate (Sprint 7, SEC4-620). Independent of the other
  # services — only used locally to run `mvn sonar:sonar` / the Python
  # scanner image against. Added as its own block to keep this additive and
  # merge-friendly alongside the other members' service additions.
  sonarqube:
    image: sonarqube:community
    ports:
      - "9000:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  postgres-data:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
